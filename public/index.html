<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케어갭 CareGap 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 병원 EMR 화면을 닮은 차분한 작업 화면: 좌측 정보, 가운데 작업, 우측 메모의 3단 */
  --ink:#16222e; --sub:#55657a; --line:#d6dee8; --bg:#eef2f6; --panel:#ffffff;
  --accent:#1d5fa8; --accent-soft:#e3edf8;
  --ok:#2f7d4f; --warn:#b26b00; --crit:#b3261e; --ok-soft:#e5f3ea; --warn-soft:#fbf0dc; --crit-soft:#f9e3e1;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:20px} h3{font-size:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--ink);color:#fff;flex-wrap:wrap}
header.top .brand{font-weight:700;letter-spacing:.02em}
header.top .brand small{font-weight:400;opacity:.7;margin-left:6px}
.steps{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.steps span{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.steps span.on{background:#fff;color:var(--ink);font-weight:600}
.steps span.done{color:#fff}
.who{font-size:13px;opacity:.85}
main{padding:18px 20px 40px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid3{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.3fr) minmax(260px,1fr);gap:14px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:980px){.grid3,.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--sub)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.sm{padding:3px 8px;font-size:13px}
input[type=text],select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:60px}
label{font-size:13px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.tag.crit{background:var(--crit-soft);color:var(--crit)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--sub);font-weight:600;background:#f6f8fb}
.tablewrap{overflow-x:auto}
/* 카덱스 */
.kardex{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kardex .khead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.kardex .khead b{font-size:16px}
.kardex dl{display:grid;grid-template-columns:92px 1fr;margin:0}
.kardex dt,.kardex dd{padding:6px 12px;border-bottom:1px solid var(--line);margin:0;font-size:14px}
.kardex dt{color:var(--sub);background:#fafbfd}
/* 메모 */
#memoList{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.memo{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fffef7}
.memo .mh{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--sub)}
.slot{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;display:flex;flex-direction:column;gap:4px}
.slot .sh{font-size:13px;color:var(--sub);border-bottom:1px dashed var(--line);padding-bottom:3px}
.slot .memo{border:0;border-left:3px solid #e7d98a;border-radius:0;padding:3px 8px}
.slot .memo .mh{float:right}
.memo.star{border-color:var(--warn)}
.memo.circle{box-shadow:inset 3px 0 0 var(--accent)}
.plist{display:flex;flex-direction:column;gap:4px}
.pbtn{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;cursor:pointer}
.pbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.caption{min-height:64px;padding:12px;border-radius:8px;background:#f6f8fb;border:1px dashed var(--line)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);width:0}
/* 병실 배치도 */
.ward{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){.ward{grid-template-columns:repeat(2,1fr)}}
.bed{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.bed.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bed.seen{background:#f6f8fb}
.bed .rm{font-family:var(--mono);font-size:12px;color:var(--sub)}
/* 업무표 */
.sched td.t{font-family:var(--mono);width:64px;color:var(--sub)}
.task{display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:13px;border:1px solid var(--line);background:#fff}
.task.me{border-left:4px solid var(--accent)}
tr.dropover td{background:var(--accent-soft)}
#taskForm.flash{box-shadow:0 0 0 3px var(--accent-soft);border-radius:8px}
.memo[draggable=true]{cursor:grab}
.task.act{border-left:4px solid #6b8e23}
.task.auto{background:#f6f8fb}
.task.done{opacity:.55}
.task.held{border-color:var(--warn);background:var(--warn-soft)}
.task button{border:0;background:none;cursor:pointer;color:var(--sub);padding:0}
.timer{font-family:var(--mono);font-size:22px;font-weight:600}
.timer.low{color:var(--crit)}
/* 근무 */
.clock{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.actor{border:1px solid var(--line);border-radius:8px;padding:10px}
.log{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.log div{font-size:14px;padding:4px 6px;border-radius:4px}
.log .ev{background:var(--crit-soft)} .log .ch{background:var(--accent-soft)} .log .dl{background:var(--warn-soft)}
/* 카드 */
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:#fff;border-radius:10px;max-width:620px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.card .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;cursor:pointer;width:100%}
.card .opt:hover{border-color:var(--accent)}
.card .opt.on{border-color:var(--accent);background:var(--accent-soft)}
.card .rk{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600}
.card .opt.on .rk{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 대화 */
.chat{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto;padding:4px}
.bub{max-width:88%;padding:9px 12px;border-radius:10px;white-space:pre-wrap}
.bub.ai{background:#f1f4f8;align-self:flex-start}
.bub.me{background:var(--accent);color:#fff;align-self:flex-end}
.tl tr.hl td{background:var(--warn-soft)}
.tl td{font-size:13px}
.judge{font-weight:700}
.judge.ok{color:var(--ok)} .judge.warn{color:var(--warn)} .judge.crit{color:var(--crit)}
.meter{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.notice{padding:10px 12px;border-radius:8px;background:var(--warn-soft);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const AI_BASE=window.CAREGAP_AI_BASE||'';
async function serverSample(prompt,opts={}){
  let res;
  try{res=await fetch(AI_BASE+'/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,modelTier:opts.modelTier||'default'})});}
  catch(e){throw {code:'network'};}
  if(!res.ok)throw {code:res.status===429?'rate_limited':(res.status===401||res.status===403)?'not_granted':'http_'+res.status};
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i).split('\n').find(l=>l.startsWith('data:'));buf=buf.slice(i+2);if(!line)continue;
      const ev=JSON.parse(line.slice(5));
      if(ev.type==='delta'){text+=ev.text;if(opts.onText)opts.onText({text});}
      else if(ev.type==='error')throw {code:ev.code||'server_error'};}}
  return {text};
}

/* ================= 8. 원인 대화 ================= */
const CHAT_RULES=`너는 신규간호사의 업무 수행 과정을 분석하고 임상적 판단 및 업무 역량 향상을 돕는 간호 교육 AI이다.
사용자의 업무 수행 결과를 바탕으로 단순히 정답과 오답을 알려주는 것이 아니라, 사용자가 자신의 업무 누락 원인과 개선점을 스스로 발견할 수 있도록 성찰 질문을 생성한다.

[질문 생성 원칙]
- 실제로 발생한 업무 누락, 판단 오류, 기록 부족, 위임 실패 등을 근거로 질문한다. 근거는 [빠진 간호]와 [근무 타임라인]에 있는 것만 쓴다.
- 우선순위 판단, 인계 듣기·메모, 업무 계획 및 배분, 환자 사정, 라운딩, 기록 등 역량별로 구분하여 분석한다. 각 누락에 붙은 역량을 참고한다.
- [잘한 점]에 있는 업무는 지적하지 않는다. 필요하면 짧게 인정해 준다.
- 잘못된 행동 자체보다 해당 행동이 발생한 원인과 개선 방법에 초점을 맞춘다.
- 정답을 바로 알려주기보다 사용자가 스스로 생각할 수 있는 개방형 질문을 우선한다. 우선순위 등급(P1~P4)이나 "정답은 ~"은 이 단계에서 공개하지 않는다.
- 한 번에 질문은 하나만 한다. 가장 개선이 필요한 부분부터 다룬다.
- 환자 안전과 직접적으로 관련된 누락을 다른 업무상의 미흡함보다 먼저 다룬다. [빠진 간호]는 안전 우선순위 순서로 정렬되어 있다.
- 실제로 발생하지 않은 실수나 누락을 임의로 만들어 질문하지 않는다.

[질문 생성 방식] 누락 하나마다 아래 순서로, 한 메시지에 한 단계씩 진행한다.
① 발견된 문제: 사용자가 놓친 업무나 부족했던 역량을 시간·환자·결과와 함께 구체적으로 제시한다. (예: "타임라인 12:10 줄을 보면…")
② 성찰 질문: 그 상황에서 왜 그렇게 행동했는지, 어떤 정보를 놓쳤는지 묻는다. (①과 같은 메시지에서 이어서 물어도 된다)
③ 개선 질문: 사용자의 답을 받아 원인을 함께 정리한 뒤, 다음 근무에서 같은 상황이 오면 어떻게 행동할지 묻는다. 사용자가 자기 탓만 하면 그때 병동 상황(누가 어디에 있었는지)을, 상황 탓만 하면 그때 할 수 있었던 다른 선택을 타임라인에서 함께 보게 한 뒤 묻는다.
④ 실천 목표: 다음 근무에서 실천할 구체적인 행동 한 가지(언제·누가·무엇을)를 사용자가 직접 정하게 유도한다. 모호하면 한 번만 구체화를 부탁한다. 목표가 정해지면 actions에 짧게 정리한다.
한 누락의 ④가 끝나면 covered에 그 누락의 키를 넣고, 아직 다루지 않은 다음 누락으로 넘어간다. 모든 누락은 확인해야 다음 단계로 갈 수 있다. 사용자가 읽고 확인한 누락은 짧게 짚고 넘어가도 된다. 모두 다뤘으면 "원인 정리"로 넘어가자고 안내한다. 사용자가 특정 누락을 보고 싶다고 하면 그 누락의 ①②부터 시작한다.

[말투]
- 비난하거나 평가하는 말투가 아닌 교육적이고 객관적인 말투(해요체). 사용자의 직전 답을 구체적으로 받아서 이어 간다. 같은 표현을 반복하지 않는다.
- 사용자가 질문하면 그 질문에 먼저 답한다.
- 2~5문장, 목록·제목·이모지 없이 채팅 말투로. 근거는 "기록"이 아니라 화면 왼쪽 "타임라인 HH:MM 줄"로 짚는다.
- 첫 메시지는 "근무 수고했어요"로 시작하고, 빠진 간호가 여러 건이면 몇 건인지와 그중 환자 안전과 가장 직결된 것부터 보자고 말한 뒤 그 누락의 ①②로 들어간다.
- 사용자가 "모르겠어요"라고 하면 buttons에 짧은 보기 2~3개를 준다.

출력 형식: 먼저 사용자에게 보낼 답만 쓰고, 다음 줄에 ### 를 쓰고, 그 뒤에 JSON 하나:
{"stage":"①②|③|④|다음","focus":"지금 다루는 누락 한 줄","covered":["④까지 마친 누락의 키"],"buttons":[],"actions":["사용자가 정한 실천 목표"],"orgFactors":["바꿀 수 없던 요인"],"balance":"personal|org|both|none","done":false}`;
function wellDone(run){

function judgeRank(run){
  const ans=answerOrder(run.rankOpts);const mine=run.rank;
  if(JSON.stringify(ans)===JSON.stringify(mine))return ['ok','적절'];
  const firstP4=mine.indexOf('R');const lastP2=Math.max(...mine.map((k,i)=>run.rankOpts.find(o=>o.k===k).g===2?i:-1));
  if(mine[0]===ans[0]||firstP4>lastP2)return ['warn','부분적으로 적절'];
  return ['crit','재검토 필요'];
}
function roundEval(){
  return SCN.ROUND_KEYS.map(p=>{const r=S.run1.round[p]||{};const o=OBS[p];let ok,why;
   if(o.need.length){ok=(r.d==='act'||r.d==='both')&&o.need.some(n=>(r.a||[]).includes(n));why=`필요한 즉시 조치: ${o.need.join(', ')}`;}
   else{ok=r.d==='memo'||r.d==='both'||((r.a||[]).some(x=>/주치의|EDBC/.test(x)));why=o.why||'메모해 두고 재확인할 대상';}
   const dl={act:'즉시 조치',memo:'메모',both:'둘 다',skip:'넘어감'}[r.d]||'보지 않음';
   return {p,ok,why,dl:dl+((r.a||[]).length?` (${r.a.join(', ')})`:'')};});
}
function infoFlow(){

}

const NA=(why)=>({st:'na',ev:why||'이번 근무에서 확인할 기회 없음'});
function bInfo(run){
  const items=INFO.filter(i=>!i.kardex).map(i=>({k:i.k,memo:S.memos.some(m=>m.pid===i.pid&&i.re.test(m.text+m.tags.join(''))),task:run.schedule.some(i.task)}));
  const linked=items.filter(x=>x.memo&&x.task),miss=items.filter(x=>!(x.memo&&x.task));
  const did=INFO.filter(i=>!i.kardex);const dOf=k=>(did.find(i=>i.k===k)||{}).did||k;
  if(linked.length>=Math.ceil(items.length*2/3))return {st:'good',ev:`음성에만 있던 정보 ${items.length}개 중 ${linked.length}개를 메모하고 업무표에 넣었어요 (${linked.map(x=>x.k).join(', ')}).`,s:`${linked.map(x=>dOf(x.k)).join(', ')}처럼 인계에서 들은 위험을 메모하고 업무표에 넣었어요.`};
  return {st:'needs',s:`음성에만 있던 ${miss.map(x=>x.k).join(', ')} 정보가 ${miss.every(x=>!x.memo)?'인계장과 업무표':'업무표'}에서 빠졌어요.`,ev:`음성에만 있던 정보 ${items.length}개 중 업무표까지 이어진 건 ${linked.length}개예요. 빠진 것: ${miss.map(x=>`${x.k} (인계장 ${x.memo?'✔':'✖'}·업무표 ${x.task?'✔':'✖'})`).join(', ')}.`};
}
function bRound(run){
  const r=run.round||{};const keys=SCN.ROUND_KEYS.filter(p=>OBS[p].need.length);
  const ok=keys.filter(p=>{const x=r[p]||{};return (x.d==='act'||x.d==='both')&&OBS[p].need.some(n=>(x.a||[]).includes(n));});
  const miss=keys.filter(p=>!ok.includes(p));
  if(!miss.length)return {st:'good',s:`라운딩에서 본 위험(${ok.map(p=>OBS[p].need[0]).join(', ')})을 그 자리에서 조치했어요.`,ev:`라운딩에서 ${ok.map(p=>`${P[p].name} 님(${OBS[p].need[0]})`).join(', ')}을 그 자리에서 조치했어요.`};
  return {st:'needs',s:`라운딩에서 본 위험(${miss.map(p=>`${P[p].name} 님 ${OBS[p].need[0]}`).join(', ')})을 그대로 뒀어요.`,ev:`라운딩에서 ${miss.map(p=>`${P[p].name} 님(${OBS[p].need[0]})`).join(', ')} 조치를 하지 않았어요.`};
}
function bHandoff(run){
  const need=SCN.handoffNeed(run);const sel=(S.handoff&&S.handoff.sel)||[];const miss=need.filter(i=>!sel.includes(i));
  if(!need.length)return NA();
  return miss.length?{st:'needs',ev:`인계에 넣어야 할 ${need.length}개 중 ${miss.map(i=>SCN.HANDOFF[i][0]).join(', ')}을 빠뜨렸어요.`}:{st:'good',ev:`인계에 넣어야 할 ${need.length}개를 모두 넣었어요.`};
}

function profile(b){
  const M={'인계 듣기·메모':['info'],'계획 세우기':['edu','emo'],'우선순위':['prio','report'],'업무 배분':['deleg','round'],'인계하기':['handoff']};

  return out;
}

/* PDF: 리포트 화면을 이미지로 찍어 A4 쪽으로 나눔 → 브라우저 다운로드로 저장 */
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s);});}
async function savePdf(btn){
  const msg=$('#pdfMsg');const say=t=>{if(msg)msg.textContent=t;};
  btn.disabled=true;say('PDF를 만드는 중…');
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const el=$('#report');
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#eef2f6',useCORS:true,ignoreElements:n=>n.classList&&n.classList.contains('noprint')});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const M=10,W=210-2*M,H=297-2*M;const pxPerMm=canvas.width/W;const pageH=Math.floor(H*pxPerMm);
    for(let y=0,i=0;y<canvas.height;y+=pageH,i++){
      const h=Math.min(pageH,canvas.height-y);const c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      const g=c.getContext('2d');g.fillStyle='#eef2f6';g.fillRect(0,0,c.width,h);g.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(i>0)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M,M,W,h/pxPerMm);
    }
    const blob=pdf.output('blob');
    downloadBlob(blob,`케어갭_결과리포트_${(S.name||'참여자').replace(/[\\/:*?"<>|]/g,'')}.pdf`);
    say('PDF를 저장했어요.');
  }catch(e){say('PDF를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.');}
  btn.disabled=false;
}

  b.edu=jt?{st:'good',ev:`퇴원(11시) 전 문태호 님 흡입기 교육을 업무표 ${hm(jt.t)}에 미리 잡았어요.`,s:'퇴원 환자 교육 시간을 업무표에 미리 잡았어요.'}
          :{st:'needs',ev:`문태호 님 퇴원(11시) 전 흡입기 교육 시간을 업무표에 미리 잡지 않았어요.${run.flags.Jedu?'':' 결국 퇴원 전 교육이 빠졌어요.'}`,s:'퇴원 환자 교육 시간을 미리 잡지 않았어요.'};
  const iOK=c.c0850==='1'&&c.c1020!=='2';
  b.interrupt=iOK?{st:'good',ev:'08:50 투약 준비 중 전화에 하던 곳을 표시하고 받았고, 10:20 보호자 질문에도 교육을 끝까지 이어 갔어요.',s:'업무가 끊길 때 하던 곳을 표시하고 다시 돌아왔어요.'}
                 :{st:'needs',ev:[c.c0850!=='1'?`08:50 전화에 "${S2_CARDS[0].opts.find(o=>o[0]===c.c0850)[1]}"을 골랐어요`:'',c.c1020==='2'?'10:20 보호자 질문에 흡입기 교육을 멈추고 서류부터 설명했어요':''].filter(Boolean).join('. ')+'.',s:'업무가 끊긴 뒤 하던 일로 돌아오지 못했어요.'};
  b.report=c.c1340?(c.c1340==='1'?{st:'good',ev:'13:40 노재현 님 SpO2 85%에 입원을 잠시 맡기고 직접 확인한 뒤 주치의에게 보고했어요.',s:'노재현 님 SpO2 85%에 직접 가서 확인하고 보고했어요.'}:{st:'needs',ev:`13:40 노재현 님 SpO2 85%에 "${S2_CARDS[4].opts.find(o=>o[0]===c.c1340)[1]}"을 골랐어요.`,s:'노재현 님 SpO2 85%에 직접 확인·보고가 늦었어요.'})
           :NA('이번 근무에서는 상태가 갑자기 변한 환자가 없어 확인할 기회 없음');
  const gOK=(run.tasks||[]).some(t=>t.pid==='G'&&(t.kind==='정서적 지지'||t.rk==='G')&&t.st==='done'&&t.start<840);
  b.emo=gOK?{st:'good',ev:'밤새 울었던 배선영 님과 14시 전에 대화하는 시간을 가졌어요.',s:'배선영 님과 대화하는 시간을 따로 가졌어요.'}:{st:'needs',ev:'밤새 울었던 배선영 님과 대화하는 시간을 갖지 못했어요.',s:'배선영 님 정서적 지지가 빠졌어요.'};
  return b;
 }
};
const SCN_BY={1:SCN1,2:SCN2};
function loadScenario(sc){SCN=sc;PIDS=sc.PIDS;P=sc.P;HANDOVER=sc.HANDOVER;INFO=sc.INFO;CANNED_Q=sc.CANNED;OBS=sc.OBS;AUTO_TASKS=sc.AUTO;CARDS=sc.CARDS;}

/* ================= 1차 → 2차 근무 전환 ================= */
const SHIFT_KEYS=['kLeft','rLeft','reviewed','discussed','memos','kv','kvLog','plays','hvDone','round','schedule','schedLeft','schedUsed','run1','run2','mode','chat','chatActions','chatBalance','summary','plan','reqText','reqFeedback','handoff','rewindPoint','aiReport','orgFactors','hl','scripted','chatButtons','chatBusy','chatRetry','chatErr','presetChoices'];
function freshShift(){return {kLeft:300,rLeft:300,memoEdit:null,reviewed:[],discussed:[],memos:[],kv:{},kvLog:[],plays:0,hvDone:false,round:{},schedule:[],schedLeft:480,schedUsed:0,run1:null,run2:null,mode:'first',chat:[],chatActions:[],chatBalance:'none',summary:null,plan:null,reqText:'',reqFeedback:'',handoff:null,rewindPoint:null,aiReport:'',orgFactors:[],hl:[],scripted:false,chatButtons:[],chatBusy:false,chatRetry:false,chatErr:false,presetChoices:null};}
function withShift(h,fn){const keep={};SHIFT_KEYS.forEach(k=>{keep[k]=S[k];S[k]=h[k];});const ks=S.shiftNo;S.shiftNo=1;const cur=SCN;loadScenario(SCN_BY[h.scn]);
  try{fn();}finally{SHIFT_KEYS.forEach(k=>S[k]=keep[k]);S.shiftNo=ks;loadScenario(cur);}}
function resetUI(){HV={i:-1,playing:false,timer:null,caption:false};KSEL=null;RSEL=null;SF={pid:SCN.SF_PID,kind:'보행 동행',t:600,who:'act',etc:'',from:null};SKV=PIDS[0];QA=[];SC={idx:0,step:0,vague:false};R=null;S.viewArch=false;S.aiCompare='';}
function startShift2(){
  const h={scn:SCN.id,title:SCN.title};SHIFT_KEYS.forEach(k=>h[k]=S[k]);h.beh=behaviors(S.run1);h.practice=S.practice&&S.practice.length?S.practice:pickPractice(h.beh);
  S.hist={1:h};S.practice=h.practice;Object.assign(S,freshShift());S.shiftNo=2;loadScenario(SCN2);resetUI();go('assign');
}

loadScenario(SCN1);
render();
</script>
